version: 0.2
phases:
  pre_build:
    commands:
      - echo "Connectivity check…"
      - curl -I https://github.com || true
      - curl -I https://registry.npmjs.org || true
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - node -v
      - npm ci
  build:
    commands:
      - npx medusa db:generate variantImages
      - npx medusa db:migrate
artifacts:
  files:
    - "migrations/**"
    - "packages/**"
    - "apps/**"
    - "package.json"
    - "package-lock.json"
